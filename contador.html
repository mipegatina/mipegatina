<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Contador · Mi Pegatina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Misma paleta que el index de mipegatina.club */
  :root{
    --bg:#ffffff; --bg2:#f4f4f5; --border:#e2e2e5; --ink:#0a0a0a; --gray2:#52525b; --gray3:#71717a;
    --green:#00c264; --green2:#00a855; --green3:rgba(0,194,100,.1);
    --sans:'Inter',sans-serif; --mono:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;cursor:default}
  header{display:flex;justify-content:space-between;align-items:center;height:clamp(56px,8vh,96px);padding:0 4vw;
    border-bottom:1px solid var(--border);background:rgba(255,255,255,.9)}
  .brand{display:flex;align-items:center;gap:clamp(10px,1.2vw,18px)}
  .brand img{height:clamp(30px,5vh,56px);width:auto;filter:brightness(0);opacity:.9}
  .brand span{font-weight:600;color:var(--gray3);font-size:clamp(15px,1.8vw,28px);letter-spacing:-.01em}
  .clock{color:var(--gray2);font-weight:500;font-size:clamp(14px,1.6vw,24px);font-variant-numeric:tabular-nums}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 3vw;position:relative}
  .label{display:flex;align-items:center;gap:.6em;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:clamp(12px,1.4vw,22px);margin-bottom:2vh}
  .label::before{content:'';width:.6em;height:.6em;border-radius:50%;background:var(--green);box-shadow:0 0 0 .3em var(--green3);animation:dot 2s infinite}
  @keyframes dot{50%{box-shadow:0 0 0 .55em rgba(0,194,100,0)}}
  .total{font-weight:900;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums;font-size:clamp(64px,16vw,300px);color:var(--ink)}
  .total.bump{animation:bump .6s ease}
  @keyframes bump{40%{transform:scale(1.03);color:var(--green)}}
  .next{margin-top:3vh;width:min(70vw,900px)}
  .bar{height:clamp(8px,1.2vh,14px);background:var(--bg2);border:1px solid var(--border);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--green);box-shadow:0 0 16px rgba(0,194,100,.35);transition:width 1.2s ease}
  .next p{display:flex;justify-content:space-between;margin-top:1.2vh;color:var(--gray3);font-weight:500;font-size:clamp(12px,1.4vw,21px);font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;padding:0 6vw 5vh}
  .stat{border-left:2px solid rgba(0,194,100,.35);padding:.4vh 0 .4vh 1.6vw}
  .stat small{color:var(--gray3);font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(11px,1.1vw,17px)}
  .stat b{display:block;font-weight:800;font-size:clamp(28px,4.4vw,72px);font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin-top:.4vh;color:var(--ink)}
  .stat:first-child b{color:var(--green)}
  .plus{position:absolute;font-weight:800;font-size:clamp(28px,4.5vw,72px);color:var(--green);top:14%;right:10%;opacity:0;pointer-events:none;letter-spacing:-.03em}
  .plus.go{animation:plus 2.4s ease forwards}
  @keyframes plus{0%{opacity:0;transform:translateY(20px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
  .party{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,255,255,.97);opacity:0;pointer-events:none;transition:opacity .5s;z-index:5;text-align:center;padding:4vw}
  .party.on{opacity:1}
  .party img{height:clamp(60px,12vh,140px);filter:brightness(0);margin-bottom:3vh}
  .party h2{font-weight:900;font-size:clamp(40px,10vw,190px);line-height:.95;letter-spacing:-.05em;color:var(--ink)}
  .party p{font-weight:700;font-size:clamp(18px,3vw,48px);color:var(--green);margin-top:2vh}
  .last{margin-top:3vh;color:var(--gray3);font-size:clamp(14px,1.6vw,24px);text-align:center;min-height:1.2em}
  .last b{color:var(--ink);font-weight:600} .last em{color:var(--green);font-style:normal;font-weight:800}
  .status{position:fixed;left:4vw;bottom:1.2vh;font-size:12px;color:var(--gray3);opacity:.7}
  .status.err{color:#e5484d;opacity:1}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:6}
  .brand span{white-space:nowrap}
  @media (max-width:640px){
    header{padding:0 16px}
    .clock{font-size:13px}
    .label{font-size:11px;letter-spacing:.12em}
    .total{font-size:18.5vw}
    .next{width:calc(100vw - 32px)}
    .next p,.last{font-size:13px}
    .plus{top:22%;right:16px;font-size:30px}
    .stats{grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 32px}
    .stat{padding:2px 0 2px 10px}
    .stat small{font-size:10px;letter-spacing:.1em}
    .stat b{font-size:clamp(20px,6.5vw,30px)}
    .status{left:16px}
  }
  @media (max-height:500px){
    .label{margin-bottom:1vh}
    .total{font-size:min(16vw,24vh)}
    .next{margin-top:2vh} .last{margin-top:1.5vh}
    .stats{padding-bottom:3vh}
    .stat b{font-size:clamp(20px,7vh,48px)}
    .status{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="img/img-01.png" alt="Mi Pegatina"><span>· Taller</span></div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <div class="label">Stickers producidos desde 2020</div>
  <div class="total" id="total">—</div>
  <div class="plus" id="plus"></div>
  <div class="next">
    <div class="bar"><i id="bar"></i></div>
    <p><span id="nextLabel">Próximo festejo</span><span id="nextLeft"></span></p>
  </div>
  <div class="last" id="last"></div>
</main>

<section class="stats">
  <div class="stat"><small>Hoy</small><b id="hoy">—</b></div>
  <div class="stat"><small>Esta semana</small><b id="semana">—</b></div>
  <div class="stat"><small>Este mes</small><b id="mes">—</b></div>
</section>

<div class="party" id="party"><img src="img/img-01.png" alt=""><h2 id="partyTitle"></h2><p id="partySub"></p></div>
<div class="status" id="status"></div>
<canvas id="fx"></canvas>

<script>
(function(){
  var API = '/.netlify/functions/contador';
  var POLL_MS = 30000;
  var STEP = 10000;                                   // festejo chico cada 10.000
  var BIG = [7500000, 8000000, 8500000, 9000000, 9500000, 10000000]; // festejos grandes
  var DEMO = /[?&]demo/.test(location.search);

  var fmt = function(n){ return Math.round(n).toLocaleString('es-AR'); };
  var $ = function(id){ return document.getElementById(id); };
  var shown = 0, last = null;

  // ---------- Reloj ----------
  function tick(){
    var narrow = innerWidth < 640; var c = new Date().toLocaleString('es-AR', narrow ? {timeZone:'America/Argentina/Buenos_Aires',weekday:'short',hour:'2-digit',minute:'2-digit'} : {timeZone:'America/Argentina/Buenos_Aires',weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}); $('clock').textContent = c.charAt(0).toUpperCase() + c.slice(1);
  }
  tick(); setInterval(tick, 10000);

  // ---------- Número animado ----------
  function animateTo(target){
    var from = shown, start = performance.now(), dur = Math.min(2500, 600 + Math.abs(target-from)/5);
    (function step(t){
      var p = Math.min(1,(t-start)/dur), e = 1-Math.pow(1-p,3);
      shown = from + (target-from)*e;
      $('total').textContent = fmt(shown);
      if(p<1) requestAnimationFrame(step);
    })(start);
  }

  function nextMilestone(n){
    var small = (Math.floor(n/STEP)+1)*STEP;
    var big = BIG.filter(function(b){return b>n;})[0];
    return (big && big<=small) ? big : small;
  }

  function render(d){
    var prev = last; last = d;
    animateTo(d.total);
    $('hoy').textContent = fmt(d.hoy);
    $('semana').textContent = fmt(d.semana);
    $('mes').textContent = fmt(d.mes);
    var u = d.ultimos && d.ultimos[0];
    $('last').innerHTML = u ? 'Último pedido archivado: <b></b> <em></em>' : '';
    if(u){ $('last').querySelector('b').textContent = u.nombre; $('last').querySelector('em').textContent = '+' + fmt(u.stickers); }

    var nm = nextMilestone(d.total), from = nm - STEP;
    $('bar').style.width = Math.max(2, Math.min(100, (d.total-from)/STEP*100)) + '%';
    $('nextLabel').textContent = 'Próximo festejo: ' + fmt(nm);
    $('nextLeft').textContent = 'faltan ' + fmt(nm - d.total);

    if(prev && d.total > prev.total){
      var el = $('plus'), t = $('total');
      el.textContent = '+' + fmt(d.total - prev.total);
      el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
      t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump');
      checkMilestone(prev.total, d.total);
    }
  }

  function checkMilestone(a, b){
    var bigHit = BIG.filter(function(m){return a < m && b >= m;}).pop();
    if(bigHit){ return party(fmt(bigHit), bigHit%1000000===0 ? '¡' + (bigHit/1000000) + ' MILLONES DE STICKERS! 🎉' : '¡Qué locura, equipo!', true); }
    if(Math.floor(a/STEP) < Math.floor(b/STEP)){
      party(fmt(Math.floor(b/STEP)*STEP), '¡Pasamos otro hito!', false);
    }
  }

  // ---------- Festejo ----------
  function party(title, sub, big){
    $('partyTitle').textContent = title;
    $('partySub').textContent = sub;
    $('party').classList.add('on');
    confetti(big ? 900 : 300, big ? 9000 : 5000);
    setTimeout(function(){ $('party').classList.remove('on'); }, big ? 12000 : 6000);
  }

  var cv = $('fx'), ctx = cv.getContext('2d'), parts = [], running = false;
  function size(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
  size(); addEventListener('resize', size);
  var COLORS = ['#00c264','#0a0a0a','#00c264','#ff6b3d','#2f7bff','#d946ef'];  // verde marca + colores de los botones del nav
  function confetti(n, ms){
    var W = cv.width, H = cv.height, until = performance.now() + ms;
    for(var i=0;i<n;i++){
      parts.push({x:Math.random()*W, y:-Math.random()*H*0.6, vx:(Math.random()-.5)*6, vy:2+Math.random()*6,
        r:(6+Math.random()*10)*devicePixelRatio, a:Math.random()*6, va:(Math.random()-.5)*.3,
        c:COLORS[i%COLORS.length], s:Math.random()<.35, until:until});
    }
    if(!running){ running = true; requestAnimationFrame(loop); }
  }
  function loop(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(function(p){ return p.y < cv.height + 40 && t < p.until + 4000; });
    parts.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.vy += .05; p.a += p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if(p.s){ ctx.beginPath(); ctx.arc(0,0,p.r/2,0,7); ctx.fill(); }   // "stickers" redondos
      else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
      ctx.restore();
    });
    if(parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0,0,cv.width,cv.height); }
  }

  // ---------- Datos ----------
  function status(msg, err){ var s=$('status'); s.textContent = msg; s.className = 'status' + (err?' err':''); }

  function load(){
    if(DEMO) return;
    fetch(API, {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error) throw new Error(d.error);
        render(d);
        status('Actualizado ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}));
      })
      .catch(function(e){ status('Sin conexión con Trello — reintentando (' + e.message + ')', true); });
  }
  load(); setInterval(load, POLL_MS);

  // Modo demo: /contador?demo  (simula pedidos y un festejo)
  if(DEMO){
    var d = {total: 3509200, hoy: 1200, semana: 8400, mes: 23100};
    render(d);
    setInterval(function(){
      var add = [200, 500, 800, 400][Math.floor(Math.random()*4)];
      d = {total:d.total+add, hoy:d.hoy+add, semana:d.semana+add, mes:d.mes+add, ultimos:[{nombre:'#98' + Math.floor(Math.random()*10) + ' Pedido demo', stickers:add}]};
      render(d);
    }, 3500);
    status('Modo demo');
  }

  // Pantalla completa con doble click y mantener la pantalla encendida
  document.addEventListener('dblclick', function(){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });
  function wake(){ try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} }
  wake(); document.addEventListener('visibilitychange', function(){ if(!document.hidden) wake(); });
})();
</script>
</body>
</html>
